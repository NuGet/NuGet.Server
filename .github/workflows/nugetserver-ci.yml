name: NuGet.Server CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * 1-5' # Weekdays at 8 AM Eastern (UTC 12:00)
  workflow_dispatch:

env:
  BuildConfiguration: Release
  SimplePackageVersion: '1.0.0'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build
        shell: powershell
        run: |
          $buildNumber = "${{ github.run_number }}"
          $branch = "${{ github.ref_name }}" -replace '[_/]', '-'
          .\build.ps1 `
            -Configuration $env:BuildConfiguration `
            -BuildNumber $buildNumber `
            -SimpleVersion $env:SimplePackageVersion `
            -SemanticVersion "$env:SimplePackageVersion-$branch-$buildNumber" `
            -Branch "${{ github.ref_name }}" `
            -CommitSHA "${{ github.sha }}"

      - name: Run tests
        shell: powershell
        run: |
          .\test.ps1 `
            -Configuration $env:BuildConfiguration `
            -BuildNumber ${{ github.run_number }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Results.*.xml
